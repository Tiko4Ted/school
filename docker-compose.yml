services:
  db:
    image: postgres:16-alpine
    container_name: schoolms-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: schoolms
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d schoolms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
